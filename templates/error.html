{% extends "base.html" %}

{% block title %}{{ code }} - {{ title }} | UniSync{% endblock %}

{% block content %}
<div class="container-narrow" style="margin: 50px auto; text-align: center;">
  <div class="card" style="padding: 48px 32px;">
    <div style="font-size: 3.5rem; font-weight: 800; color: var(--muted-terracotta); line-height: 1; margin-bottom: 12px; font-variant-numeric: tabular-nums;">
      {{ code }}
    </div>
    <h2 style="margin-bottom: 12px;">{{ title }}</h2>
    <p style="margin-bottom: 28px; max-width: 480px; margin-left: auto; margin-right: auto; line-height: 1.5;">
      {{ message }}
    </p>

    <div style="display: flex; justify-content: center; gap: 12px;">
      <a href="{{ url_for('auth.index') }}" class="btn btn-primary">
        <span>UniSync Home</span>
      </a>
      <a href="javascript:history.back()" class="btn btn-secondary">
        <span>Go Back</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
